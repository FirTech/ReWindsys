;WTDR 配置文件
;Author: Whatk Https://blog.whatk.me
;WTDR 官网：https://wtdr.whatk.me
;==============================
[Standard]
ConfigVer=1.0
[ReadyDeploy]
Task1=R|%ProgramFiles%\WSHub\WSHub.exe|-deploying||1
Task2=R|%SystemDrive%\Windsys_Setup\Other\Deploying_Helper.exe|||1
[Deploying]
Task1=R|%SystemDrive%\Windsys_Setup\tis\tis.exe|/tweak|1
[DeployOK]
[FirstLogon]
Task1=C|taskkill /f /im msedge.exe
[FirstDesktop]
Task1=C|taskkill /f /im msedge.exe
Task2=R|%SystemDrive%\Windsys_Setup\Other\SysOpt_Desktop.bat||1
Task3=R|%SystemDrive%\Windsys_Setup\tis\tis.exe|/tweak|1
Task4=R|%SystemDrive%\Windsys_Setup\Privacy\apply.cmd||1
Task5=C|RunDll32.exe USER32.DLL,UpdatePerUserSystemParameters
[OOBE_BG]
;系统部署背景
OOBE_BG=1
;使用 黑色背景+SnackBar 风格
BlackTheme=1
[Pack]
;是否使用 WTDR.Pack 功能
Pack=1
;WTDR.Pack 调用顺序
;默认调用时机顺序为：
;=================================================================
;系统部署中  ：1、部署任务(Deploying)(OSUpdate) - 2、调用 WTDR.Pack
;首次进入桌面：1、调用 WTDR.Pack - 2、部署任务(FirstDesktop)(OSUpdate)
;=================================================================
;该选项则可以调整调用顺序，可以控制在“部署任务”前或“部署任务”后调用 WTDR.Pack
;留空则为默认
;设置值：
;=================================================================
;BeforeTask  ;部署任务前调用 WTDR.Pack
;AfterTask   ;部署任务后调用 WTDR.Pack
;=================================================================
;默认值：
;=================================================================
;Deploy_OrderCustomize=AfterTask     ;部署任务后调用
;Desktop_OrderCustomize=BeforeTask   ;部署任务前调用
;=================================================================
;系统部署中 WTDR.Pack 调用顺序
Deploy_OrderCustomize=
;首次进入桌面 WTDR.Pack 调用顺序
Desktop_OrderCustomize=
[HostName]
;===================
;主机名修改功能
;部署前执行
;备注：
;NT5需要 Sysprep.inf 内有 ComputerName 关键字
;NT6需要 unattend.xml 内有 <ComputerName> 字段
;最大长度为 15 个字节:
;可以使用 ASCII 字符 （1 个字节每个） 和/或多字节字符，如汉字，因此只要您不能超过 15 个字节的内容。
;不能使用空格或任何以下字符: {|} ~ [ \ ] ^ ':;< = > ? @ ! " # $ % ` ( ) + / . * &、 也不能包含任何空格。
;不能使用一些非标准字符，如表情符号。
;===================
;是否修改主机名？
Changer=1
;模式：1、自定义 | 2、年月日随机数 | 3、前缀（-年月日（随机数填充满15字））
Mode=3
;主机名（请勿带有空格或除-以外的符号）（请勿超过15字，超过将截断）
Name=W10
[User]
;用户设置
;启用 Administrator 账户（1为启用，留空或0则为不启用保持默认）
AdminUser=
;建立自定义账户
;帐户名不能包含以下字符: /\[]":;|<>+=,?*
CustomUser=
;将该账户归为管理员
AdminGroup=
;尽可能避免生成 Administrator.xxx 文件夹
HandleAdminDotDir=1
;设置密码
;请运行 WTDR.exe /Generatepwd 生成密码字符串粘贴到此处
PassWord=
;自动登录次数（留空或为0则为不自动登录，需要自动登录几次就填几次）（该项设置密码后才有效）
LogonCount=
[UAC]
;UAC设置，首次进入桌面调用
;总闸，关闭则保持默认
UAC=1
;===========
;等级设置
;UAC 关：1
;UAC 低：2
;UAC 中：3
;UAC 高：4
;===========
Level=2
[OSUpdate]
;系统升级相关（如RS4到RS5）
;是否接管系统升级过程（不接管则不进行WTDR功能）
Use=1
;是否需要在升级时运行任务
UpdateRun=1
;升级时运行任务
U_Task1=R|%SystemDrive%\Windsys_Setup\tis\tis.exe|/tweak|1
;是否需要在进入桌面时运行任务
UpdateDeskRun=1
;进入桌面时运行任务
D_Task1=R|%SystemDrive%\Windsys_Setup\Other\SysOpt_Desktop.bat||1
U_Task2=R|%SystemDrive%\Windsys_Setup\tis\tis.exe|/tweak|1
D_Task3=C|RunDll32.exe USER32.DLL,UpdatePerUserSystemParameters
D_Task4=R|%SystemDrive%\Windsys_Setup\Privacy\apply.cmd||1
;更新时是否需要使用Pack功能（只应用配置文件带Update字段的包）
Pack=1
;是否需要删除系统部署相关文件夹？（Other字段的ByeDel）（不接管系统升级过程也会删除）
ByeDel=1
[DriveLetter]
;理顺/整理盘符功能
;开关
Use=1
;读取记录文件整理盘符
;需要提前生成“.DriveLetterNote”记录文件
;详细可看：https://forum.wtdr.whatk.me/d/14
NoteLetter=1
;确认提示框
NoteLetterTip=1
[RDP]
;##########################
;RDP 设置
;不开启该功能则代表不开启启用 RDP 功能，不代表关闭RDP，一切按照系统默认
;设置只是用于启用该功能，并不代表关闭该功能
;启用 RDP 的同时会将该端口添加至防火墙
;##########################
;是否启用 RDP （关闭并不会帮你关闭 RDP，只是不启用 RDP 服务，RDP 服务状态一切按照系统默认）
Enable=
;端口设置（留空则不更改）
Port=
;禁用使用空密码的本地账户只允许进行控制台登录（如账户未设置密码则需要将此项启用才可以 RDP 连接）
LimitBlankPwd=
[Other]
;纯净模式（仅完成必要的系统部署操作，不执行其他任务）
PureMode=0
;自我删除，首次进入桌面运行生效（最低优先级） （仅删除自身和自身生成的文件）（配合下面使用更佳）
DelMe=Y
;删除系统部署相关文件夹，首次进入桌面运行生效（最低优先级）（只能一条，所以通常用来配合楼上擦屁股 = =）（延时10秒）
ByeDel=%SystemDrive%\Windsys_Setup\
;循环尝试删除系统部署相关文件夹直到删除完毕为止（防止产生残留）
ByeDel_Watch=1
;部署阶段错误监控（遇到部分错误会弹出提示）
OOBEWatchDog=1
;首次登陆时运行权限由SYSTEM降至管理员权限（建议保持关闭！WTDR部分功能需要通过SYSTEM权限执行，特殊情况除外）
LogonRunasAdmin=0
