[SysOpt]
;系统相关设置
;系统壁纸（放置WTDR根目录，设置填写文件名，后缀名务必为 jpg 或 bmp）
Wallpaper=Wallpaper.jpg

;锁屏壁纸（放置WTDR根目录，设置填写文件名，后缀名务必为 jpg，Win7锁屏壁纸则要求大小不超过 256KB）
LockScreen=

;关闭系统休眠
OffHiber=0

;启用卓越性能  （仅win10，部分计算机无效）
ExcellentPF=

;Windows 更新设置（0、系统默认  1、打开自动更新  2、关闭自动更新）（仅测试过Win10）
;独立版：https://whatk.me/wucontrol/
WUControl=0

;禁用 Windows Defender（仅测试过Win10）
;独立版：https://whatk.me/wdcontrol/
DisableWD=1

;禁用 Windows Firewall (系统防火墙)
DisableFireWall=

;SmartScreen 状态 (0 为关闭、1 为启用、留空则不作处理)
SmartScreen=

;清理图标缓存
ClearIconCache=1

;禁止首次开机启动时安装 OneDrive
DisableInstallOD=

;系统保留空间状态（可能会占用部分系统空间）（0为关闭、1为启用、留空则不作处理）
ReservedStorageState=

;英特尔事务同步扩展技术 (Intel TSX) 状态（0为关闭、1为启用、留空则不作处理）
;该技术可以提高英特尔处理器性能，但存在安全漏洞，所以系统默认会禁用该技术
;详情可参考：https://www.landian.vip/archives/66939.html
IntelTSX=

;禁止创建旧 Edge 快捷方式
DisableEdgeDesktopShortcutCreation=

;关闭打开可执行程序时的“安全警告”
DisableExecuteRiskWarn=

;绕过 Windows 11 OOBE 强制要求联网
BypassNRO=

;隐藏 Windows 11 不受支持硬件水印/通知
UnsupportedHardwareNotification=

;关闭任务栏“天气与资讯”
DisableFeed=

;在桌面显示我的电脑
ThisPCLnk=

;在桌面显示用户文件夹
UserLnk=

;隐藏快捷方式小箭头
HideLnkIcon=